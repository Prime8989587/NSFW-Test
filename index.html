<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoonRose</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="age-gate">
  <div class="gate-card">
    <h1>Goon<span>Rose</span></h1>
    <p>This game contains suggestive adult themes.<br>You must be 18 or older to play.</p>
    <button id="gate-yes">I am 18+ — Enter</button>
    <button id="gate-no" class="ghost">Leave</button>
  </div>
</div>

<main id="game" hidden>
  <header>
    <h1>Goon<span>Rose</span></h1>
    <div class="meter" title="How comfortable Rose feels with you">
      <label>Trust</label>
      <div class="bar"><i id="trust-fill"></i></div>
      <b id="trust-num">0</b>
    </div>
    <button id="reset" class="ghost small">Reset</button>
  </header>

  <section id="stage">
    <svg id="rose" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg" data-mood="neutral">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f1c3a0"/><stop offset=".5" stop-color="#f8d6b9"/><stop offset="1" stop-color="#eab995"/>
        </linearGradient>
        <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8d2b3a"/><stop offset="1" stop-color="#5a1424"/>
        </linearGradient>
        <path id="legL" d="M153 408 Q150 500 163 570 L166 738 L192 738 L196 570 Q203 480 200 408 Z"/>
        <path id="legR" d="M247 408 Q250 500 237 570 L234 738 L208 738 L204 570 Q197 480 200 408 Z"/>
        <clipPath id="thighHigh"><rect x="100" y="480" width="200" height="270"/></clipPath>
        <radialGradient id="floor" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="200" cy="765" rx="120" ry="16" fill="url(#floor)"/>

      <g id="root">
      <g id="breath">

        <!-- hair behind -->
        <g id="hairBack">
          <path d="M136 108 C124 200 134 300 158 340 L242 340 C266 300 276 200 264 108 Z" fill="url(#hair)"/>
        </g>

        <!-- ===== BASE BODY ===== -->
        <g id="body">
          <use href="#legL" fill="url(#skin)"/>
          <use href="#legR" fill="url(#skin)"/>
          <rect x="188" y="148" width="24" height="46" fill="#eab995"/>
          <path d="M158 192 Q200 180 242 192 L238 260 Q232 300 226 330 Q247 370 249 415 L151 415 Q153 370 174 330 Q168 300 162 260 Z" fill="url(#skin)"/>
          <!-- arms -->
          <g class="armL"><path d="M156 202 L132 290 L122 372" fill="none" stroke="#f1c3a0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><circle cx="121" cy="380" r="13" fill="#f1c3a0"/></g>
          <g class="armR"><path d="M244 202 L268 290 L278 372" fill="none" stroke="#f1c3a0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><circle cx="279" cy="380" r="13" fill="#f1c3a0"/></g>
        </g>

        <!-- lingerie: Rose's comfort limit, always stays on -->
        <g id="lingerie">
          <path d="M170 246 Q185 278 200 254 Q215 278 230 246 Q215 232 200 242 Q185 232 170 246Z" fill="#3a0f1f" stroke="#c0405f" stroke-width="1.5"/>
          <path d="M172 244 L166 200 M228 244 L234 200" stroke="#3a0f1f" stroke-width="3" fill="none"/>
          <path d="M153 396 L247 396 L206 442 L200 434 L194 442 Z" fill="#3a0f1f" stroke="#c0405f" stroke-width="1.5"/>
        </g>

        <!-- ===== CLOTHING LAYERS (bottom → top) ===== -->
        <g class="cloth" id="c-stockings" data-id="stockings">
          <use href="#legL" fill="#2a1520" fill-opacity=".72" clip-path="url(#thighHigh)"/>
          <use href="#legR" fill="#2a1520" fill-opacity=".72" clip-path="url(#thighHigh)"/>
          <rect x="150" y="480" width="52" height="5" fill="#c0405f" opacity=".8"/>
          <rect x="198" y="480" width="52" height="5" fill="#c0405f" opacity=".8"/>
        </g>

        <g class="cloth" id="c-shoes" data-id="shoes">
          <path d="M160 734 L196 734 L201 762 L148 762 Q148 748 160 734Z" fill="#a8183a"/>
          <path d="M240 734 L204 734 L199 762 L252 762 Q252 748 240 734Z" fill="#a8183a"/>
          <rect x="150" y="758" width="50" height="5" fill="#5a0c20"/>
          <rect x="200" y="758" width="50" height="5" fill="#5a0c20"/>
        </g>

        <g class="cloth" id="c-skirt" data-id="skirt">
          <path d="M166 332 L234 332 L266 522 Q200 540 134 522 Z" fill="#5b2a6e"/>
          <path d="M184 336 L170 528 M200 336 L200 534 M216 336 L230 528" stroke="#3f1a4f" stroke-width="2" fill="none"/>
          <rect x="164" y="326" width="72" height="12" rx="3" fill="#3f1a4f"/>
        </g>

        <g class="cloth" id="c-top" data-id="top">
          <path d="M156 192 Q200 176 244 192 L240 262 Q236 300 231 346 L169 346 Q164 300 160 262Z" fill="#fbf1e8"/>
          <path d="M180 188 Q200 224 220 188" fill="none" stroke="#e5d3c4" stroke-width="3"/>
          <circle cx="200" cy="262" r="2.5" fill="#d8c3b3"/><circle cx="200" cy="292" r="2.5" fill="#d8c3b3"/><circle cx="200" cy="322" r="2.5" fill="#d8c3b3"/>
          <g class="armL"><path d="M156 202 L141 258" fill="none" stroke="#fbf1e8" stroke-width="30" stroke-linejoin="round"/></g>
          <g class="armR"><path d="M244 202 L259 258" fill="none" stroke="#fbf1e8" stroke-width="30" stroke-linejoin="round"/></g>
        </g>

        <g class="cloth" id="c-jacket" data-id="jacket">
          <path d="M152 190 L190 184 L188 382 L146 382 Q150 300 152 190Z" fill="#26263a"/>
          <path d="M248 190 L210 184 L212 382 L254 382 Q250 300 248 190Z" fill="#26263a"/>
          <path d="M190 184 L170 236 L190 250Z M210 184 L230 236 L210 250Z" fill="#383852"/>
          <g class="armL"><path d="M156 202 L132 290 L124 352" fill="none" stroke="#26263a" stroke-width="30" stroke-linejoin="round"/><rect x="108" y="346" width="32" height="8" fill="#383852" transform="rotate(14 124 350)"/></g>
          <g class="armR"><path d="M244 202 L268 290 L276 352" fill="none" stroke="#26263a" stroke-width="30" stroke-linejoin="round"/><rect x="260" y="346" width="32" height="8" fill="#383852" transform="rotate(-14 276 350)"/></g>
        </g>

        <g class="cloth" id="c-scarf" data-id="scarf">
          <path d="M170 170 Q200 200 230 170 L232 188 Q200 214 168 188Z" fill="#d6264f"/>
          <path d="M214 196 L228 262 L212 258 L204 204Z" fill="#b01a3f"/>
        </g>

        <!-- ===== HEAD ===== -->
        <g id="head">
          <ellipse cx="200" cy="112" rx="40" ry="47" fill="url(#skin)"/>
          <ellipse cx="176" cy="128" rx="9" ry="5" fill="#ff6f8f" class="blush"/>
          <ellipse cx="224" cy="128" rx="9" ry="5" fill="#ff6f8f" class="blush"/>
          <path d="M172 98 Q184 92 194 98 M206 98 Q216 92 228 98" stroke="#5a1424" stroke-width="3" fill="none" stroke-linecap="round" class="brows"/>
          <g class="eyes">
            <ellipse cx="184" cy="113" rx="7" ry="5.5" fill="#fff"/><ellipse cx="216" cy="113" rx="7" ry="5.5" fill="#fff"/>
            <circle cx="185" cy="113" r="3.6" fill="#2b6a5b"/><circle cx="217" cy="113" r="3.6" fill="#2b6a5b"/>
            <circle cx="186" cy="111.5" r="1.2" fill="#fff"/><circle cx="218" cy="111.5" r="1.2" fill="#fff"/>
            <path d="M176 108 Q184 103 192 108 M208 108 Q216 103 224 108" stroke="#2b1018" stroke-width="2.5" fill="none"/>
          </g>
          <path d="M200 120 L197 130 L203 130" stroke="#d9a283" stroke-width="2" fill="none"/>
          <path class="m m-neutral" d="M191 140 Q200 144 209 140" stroke="#b02a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path class="m m-smile"   d="M189 137 Q200 152 211 137 Z" fill="#b02a4a" stroke="#b02a4a" stroke-width="2" stroke-linejoin="round"/>
          <path class="m m-shy"     d="M194 141 Q200 138 206 141" stroke="#b02a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <ellipse class="m m-wow"  cx="200" cy="142" rx="5" ry="6" fill="#8d1e3a"/>
          <!-- bangs & hair front -->
          <path d="M158 112 Q156 56 204 52 Q248 54 242 112 Q236 78 206 76 Q176 78 158 112Z" fill="url(#hair)"/>
          <path d="M158 112 Q150 150 160 176 Q166 140 166 112Z M242 112 Q250 150 240 176 Q234 140 234 112Z" fill="url(#hair)"/>
          <!-- little rose hair clip -->
          <g transform="translate(232 70)"><circle r="9" fill="#e0345f"/><path d="M-4 0 Q0 -6 4 0 Q0 5 -4 0" fill="none" stroke="#8d1236" stroke-width="1.6"/></g>
        </g>

      </g>
      </g>
    </svg>
    <div id="bubble" aria-live="polite"></div>
  </section>

  <aside id="panel">
    <section>
      <h2>Interact</h2>
      <div class="grid" id="actions"></div>
    </section>
    <section>
      <h2>Wardrobe <small>(tap an item, or tap Rose)</small></h2>
      <div class="grid" id="wardrobe"></div>
    </section>
    <p class="hint">Rose decides what she's comfortable with — build trust first. Her limit is lingerie.</p>
  </aside>
</main>

<script src="game.js"></script>
</body>
</html>
